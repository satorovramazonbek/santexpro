services:
  db:
    image: postgres:17-alpine
    container_name: santexpro_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-santexpro}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-santexpro_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d santexpro"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: santexpro_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: santexpro.settings.production
      SECRET_KEY: ${SECRET_KEY:-santexpro-prod-super-secure-key-2026}
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,frontend
      DB_NAME: ${DB_NAME:-santexpro}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-santexpro_secret_password}
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000
      SECURE_SSL_REDIRECT: "False"
      LOG_LEVEL: INFO
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             python manage.py seed_catalog &&
             python manage.py seed_demo_project &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --threads 2 santexpro.wsgi:application"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: santexpro_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "5173:80"

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
