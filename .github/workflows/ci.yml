name: SantexPro CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests & Quality (Django & PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: santexpro_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django System Check
        env:
          DJANGO_SETTINGS_MODULE: santexpro.settings.testing
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: santexpro_test
          DB_USER: postgres
          DB_PASSWORD: postgres_password
        run: |
          cd backend
          python manage.py check

      - name: Run Backend Automated Test Suite (60 tests)
        env:
          DJANGO_SETTINGS_MODULE: santexpro.settings.testing
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: santexpro_test
          DB_USER: postgres
          DB_PASSWORD: postgres_password
        run: |
          cd backend
          python manage.py test --verbosity=2

  frontend-checks:
    name: Frontend Lint & Build (React, TypeScript & Tailwind)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Linter (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Compile TypeScript & Build Production Assets
        working-directory: frontend
        run: npm run build

  docker-verification:
    name: Docker & Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        run: docker build -t santexpro-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: docker build -t santexpro-frontend:ci ./frontend
