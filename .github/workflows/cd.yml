name: SantexPro CD Pipeline (Production Deploy)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'DEPLOYMENT.md'
      - '.gitignore'

jobs:
  deploy:
    name: Automated Deploy to Production Server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS / Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/santexpro' }}
        if: env.SERVER_HOST != '' && env.SSH_PRIVATE_KEY != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/var/www/santexpro' }}
            echo ">>> Pulling latest changes from main branch..."
            git pull origin main
            echo ">>> Building and updating Docker containers..."
            docker compose down
            docker compose build --pull
            docker compose up -d
            echo ">>> Applying database migrations..."
            docker compose exec -T backend python manage.py migrate --noinput
            echo ">>> Collecting static files..."
            docker compose exec -T backend python manage.py collectstatic --noinput
            echo ">>> SantexPro Production Deployment Completed Successfully!"
